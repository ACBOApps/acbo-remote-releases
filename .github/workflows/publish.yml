# Δημοσίευση έκδοσης: όταν ανέβει branch "upload/vX.Y.Z" με τα κομμάτια του Setup,
# ενώνει το αρχείο, ελέγχει το SHA-256, δημιουργεί το Release και σβήνει το branch.
name: publish
on:
  push:
    branches: ['upload/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ένωση και έλεγχος
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#upload/v}"
          cat release/ACBO-Remote-Setup-$V.exe.part* > ACBO-Remote-Setup-$V.exe
          WANT=$(cat release/sha256.txt)
          GOT=$(sha256sum ACBO-Remote-Setup-$V.exe | cut -d' ' -f1)
          [ "$WANT" = "$GOT" ] || { echo "SHA-256 mismatch"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILES=("ACBO-Remote-Setup-$V.exe")
          # υπογεγραμμένο αρχείο έκδοσης (Ed25519) για τις αυτόματες ενημερώσεις και το ACBO Launcher
          [ -f release/acbo-remote-update.json ] && FILES+=(release/acbo-remote-update.json)
          gh release create "v$V" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" --target main --title "ACBO Remote $V" --notes-file release/notes.txt --latest
          git push origin --delete "$GITHUB_REF_NAME"
